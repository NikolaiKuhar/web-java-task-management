server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: task-service
          uri: http://localhost:8082
          predicates:
            - Path=/projects/**,/tasks/**,/comments/**,/secure/**