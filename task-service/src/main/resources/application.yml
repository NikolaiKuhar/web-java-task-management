server:
  port: 8082

spring:
  application:
    name: task-service

  datasource:
    url: jdbc:postgresql://postgres-task:5432/task_management_tasks
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

jwt:
  secret: mySuperSecretKeyForJwtTokenGeneration1234567890

auth:
  service:
    url: http://auth-service-container:8081